name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin
        run: |
          tar -czf cockpit-backup-${GITHUB_REF_NAME}.tar.gz \
              plugin backend install.sh uninstall.sh README.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              cockpit-backup-${GITHUB_REF_NAME}.tar.gz
